data:
  yaml_path: Ref/yolo_mesko4GF2/data.yaml
  image_height: 640
  image_width: 640
  num_workers: 4
  val_fraction: 0.15
  seed: 2006
  # Match the segmentation checkpoint's original image / 255 preprocessing.
  normalize_mean: 0.0
  normalize_std: 1.0
  augment: true
  aug_strategy: xray
  rotation_degrees: 7.0
  scale_min: 0.95
  scale_max: 1.05
  translate_fraction: 0.04

model:
  name: adaptive_rwkv
  num_landmarks: 129
  num_bones: 4
  input_channels: 3
  num_mask_classes: 11
  bone_class_indices: [1, 2, 3, 5]
  # Merge overlap/parent regions from the bundled segmentation class metadata.
  # femur, tibia, fibula, patella respectively:
  bone_class_groups: [[1, 6, 7], [2, 4, 8, 9, 10], [3, 4], [5]]
  query_dim: 128
  attention_heads: 4
  transformer_layers: 2
  transformer_ffn_dim: 256
  transformer_dropout: 0.1
  local_patch_size: 24
  token_patch_size: 3
  freeze_backbone: true
  # Pass the 11-class segmentation checkpoint with --checkpoint.
  checkpoint: ""
  strict_checkpoint: true

loss:
  coarse_weight: 0.5
  coordinate_weight: 1.0
  heatmap_weight: 1.0
  bone_constraint_weight: 0.05
  heatmap_sigma: 1.5

training:
  experiment_name: adaptive_rwkv_landmark
  output_dir: landmark/runs
  epochs: 100
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 5
  coarse_only_epochs: 10
  teacher_forcing_epochs: 20
  teacher_noise_pixels: 15.0
  gradient_clip: 1.0
  amp: true
  seed: 2006
  device: auto
  resume: ""
  save_every: 10
  plot_samples: 4
