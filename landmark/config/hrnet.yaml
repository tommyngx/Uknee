data:
  yaml_path: Ref/yolo_mesko4GF2/data.yaml
  image_height: 640
  image_width: 640
  num_workers: 4
  val_fraction: 0.15
  augment: true
  aug_strategy: xray

model:
  name: hrnet
  num_landmarks: 129
  input_channels: 1
  hrnet_width: 32
  checkpoint: ""

loss:
  coarse_weight: 0.0
  coarse_heatmap_weight: 0.0
  coordinate_weight: 1.0
  heatmap_weight: 1.0
  bone_constraint_weight: 0.0
  heatmap_sigma: 1.5
  heatmap_temperature: 1.0

training:
  experiment_name: hrnet_baseline
  output_dir: landmark/runs
  epochs: 120
  batch_size: 4
  learning_rate: 0.0001
