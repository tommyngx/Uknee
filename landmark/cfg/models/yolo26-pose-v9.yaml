# YOLO26 OA pose v9: v1 supervision plus independent per-region query refinement on P4 ROI features.

nc: 4
end2end: True
reg_max: 1
kpt_shape: [51, 3]
scale: l

# Learn reliable femur/tibia/fibula/patella boxes first. Landmark-specific
# losses then ramp in gradually instead of competing with detection at start.
landmark_curriculum:
  detection_only_epochs: 50
  ramp_epochs: 25
  pose_gain_scale: 0.5
  auxiliary_gain_scale: 1.0
  refinement_gain_scale: 1.0

# Preserve the four auxiliary losses from posev1; refinement losses below supervise every class instance.
oa26_loss:
  heatmap: 0.25
  coord: 0.02
  neighbour: 0.01
  curve: 0.005
  sigma: 1.5

# V9-only region refinement settings. The implementation lives under oa26_region_refine and does not modify v1-v8.
oa26_region_refine:
  enabled: true
  auxiliary_heatmap_channels: 129
  num_regions: 4
  feature_level: P4
  roi_output_size: [20, 20]
  roi_sampling_ratio: 2
  roi_padding: 0.25
  min_roi_size_px: 48
  d_model: 128
  num_heads: 4
  num_layers: 2
  gradient_checkpointing: false
  dropout: 0.1
  heatmap_temperature: 0.1
  use_coarse_spatial_prior: false
  coarse_prior_sigma: 0.25
  coarse_prior_gain: 0.5
  refined_heatmap_gain: 0.25
  refined_heatmap_sigma: 1.5
  refined_coord_gain: 0.25
  refined_neighbour_gain: 0.05
  refined_curve_gain: 0.02

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 13-P4/16
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]] # 16-P3/8
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, True]] # 19-P2/4
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]] # 22-P3/8
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 25-P4/16
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 28-P5/32
  # Architecture and loss settings are injected from the single oa26_region_refine block above.
  - [[19, 22, 25, 28], 1, OA26RegionRefinePose, [nc, kpt_shape]]
