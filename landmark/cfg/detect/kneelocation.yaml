# KneeLocation detection training preset, adapted from Ref/args_previous.yaml.
# This is an override file consumed by landmark.train_det, not a dataset YAML.
epochs: 1000
patience: 200
batch: 16
imgsz: [640, 640]
workers: 8
cache: false
pretrained: yolo26m.pt
optimizer: auto
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 7.5
cls: 0.5
dfl: 1.5
nbs: 64
amp: true
deterministic: true
seed: 2026
val: true
plots: true
save: true
save_period: -1
rect: false
cos_lr: false
close_mosaic: 500
multi_scale: 0.0

# X-ray-safe detection augmentation. Horizontal flipping remains disabled
# because class 0/1 explicitly encode right/left anatomy.
hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.0
bgr: 0.0
mosaic: 0.1
mixup: 0.0
cutmix: 0.0
copy_paste: 0.0

# Export the final best checkpoint once training completes. Disable explicitly
# with --no-auto-export-onnx when only PyTorch checkpoints are required.
auto_export_onnx: true
dynamic: false
simplify: true
