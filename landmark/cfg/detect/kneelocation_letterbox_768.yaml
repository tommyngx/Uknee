# KneeLocation detection preset with explicit aspect-preserving letterbox input.
# This is a new override file; kneelocation.yaml remains the baseline.
epochs: 1000
patience: 200
batch: 12
imgsz: [768, 768]  # [height, width], 20% larger than the 640 baseline
resize_mode: letterbox
workers: 8
cache: false
pretrained: yolo26m.pt
optimizer: auto
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 7.5
cls: 0.75  # slightly stronger left/right classification supervision
dfl: 1.5
nbs: 64
amp: true
deterministic: true
seed: 2026
val: true
plots: true
save: true
save_period: -1
rect: false
cos_lr: false
close_mosaic: 0
multi_scale: 0.0

# Letterbox-safe X-ray augmentation. Mixing is disabled so every source image
# first enters one fixed, padded 768x768 canvas without aspect-ratio distortion.
hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.25
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.0
bgr: 0.0
mosaic: 0.0
mixup: 0.0
cutmix: 0.0
copy_paste: 0.0

auto_export_onnx: true
onnx_export_interval: 10
dynamic: false
simplify: true
