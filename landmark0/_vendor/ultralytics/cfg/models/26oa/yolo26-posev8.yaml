# YOLO26 OA pose v8: canonical HRNet-W48 backbone + original YOLO26 Pose26 head.
nc: 1
end2end: True
reg_max: 1
kpt_shape: [129, 3]
scale: n

backbone:
  - [-1, 1, HRNet, [w48, False, [128, 256, 512, 512], True]] # 0
  - [0, 1, Index, [128, 0]] # 1-P2/4
  - [0, 1, Index, [256, 1]] # 2-P3/8
  - [0, 1, Index, [512, 2]] # 3-P4/16
  - [0, 1, Index, [512, 3]] # 4-P5/32

head:
  - [-1, 1, SPPF, [512, 5, 3, True]] # 5-P5/32
  - [-1, 2, C2PSA, [512]] # 6-P5/32
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 9-P4/16
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]] # 12-P3/8
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 1], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, True]] # 15-P2/4
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]] # 18-P3/8
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 21-P4/16
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, True, 0.5, True]] # 24-P5/32
  - [[15, 18, 21, 24], 1, Pose26, [nc, kpt_shape]]
