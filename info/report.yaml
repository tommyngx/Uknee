fixed_during_migration:
  - id: schema-mask-signature
    symptom: V9 raised TypeError while building its region-refinement head.
    cause: The canonical schema mask did not accept the requested local keypoint width.
    fix: class_keypoint_mask now accepts and validates max_keypoints.
  - id: cache-isolation
    symptom: landmark2 dataset preflight wrote manifests into landmark/.cache.
    fix: The default cache root is now landmark2/.cache/datasets.
  - id: slim-config-runtime-keys
    symptom: The shared pose dataset path required copy_paste_mode and mask_ratio even when both features were disabled.
    fix: The pose-only default retains required shared-pipeline keys with inert values.
  - id: torchscript-trace-stability
    symptom: A second trace pass observed mutated cached anchors and rejected the graph.
    fix: Export flags are set before tracing and the fixed graph is traced once.
  - id: onnxscript-implicit-dependency
    symptom: New PyTorch ONNX export attempted to import onnxscript.
    fix: landmark2 explicitly uses the stable legacy ONNX exporter with opset 17.
  - id: external-callback-loading
    symptom: Base lifecycle classes could auto-import optional remote experiment trackers.
    fix: Callbacks are a single local registry with no integration imports.

intentional_differences:
  - >-
    landmark2 does not expose classify, segment, semantic, OBB, tracking,
    benchmarking, HUB, or solution APIs.
  - >-
    Dataset input is a local YOLO pose YAML; NDJSON and remote Platform URIs
    fail explicitly.
  - >-
    Inference accepts native PyTorch checkpoints/modules, TorchScript, and
    ONNX only.
  - >-
    Legacy landmark checkpoint module paths are aliased only inside the
    checkpoint-unpickling context; landmark2 never installs a global
    ultralytics module alias during normal import.
  - >-
    The copied neural building-block files still contain upstream classes
    referenced by the YAML parser, even though only the five checked-in model
    YAMLs are public. Further class-level pruning is possible after training
    and resume parity are validated on production checkpoints.

recommendation:
  replace_landmark_now: false
  next_step: >-
    Run at least one real resume-training job and one validation job from an
    existing production best.pt checkpoint. If their metrics and checkpoint
    resume state match, switch imports/CLI from landmark to landmark2 and then
    remove landmark.
