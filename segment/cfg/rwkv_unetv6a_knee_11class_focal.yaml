# RWKV-UNet V6a configuration for 11-class knee segmentation.
# Spatial values are always [height, width]. CLI values override these keys.
#
# Dataset warning: Ref/unet_meskoseg_9class/data.yaml currently maps train,
# val, and test to the same folder. Create independent splits before using
# validation metrics or best.pt for model selection.
model: RWKV_UNetV6a
dataset: Ref/unet_meskoseg_9class
dataset_name: unet_meskoseg_9class
train_file_dir: train.txt
val_file_dir: val.txt

base_lr: 0.001
batch: 1
workers: 4
gpu: [0]
epochs: 200
seed: 2006

# Knee X-ray canvas, in HxW order.
imgsz: [1024, 640]

# Background + 10 anatomical/osteophyte classes.
num_classes: 11
osteophyte_only: false
input_channel: 3
aug_strategy: xray

# Cross-entropy covers all 11 classes. Focal Tversky emphasizes the four
# rare knee osteophyte classes:
#   6: lateral femoral, 7: medial femoral,
#   8: lateral tibial, 9: medial tibial.
loss: osteophyte_focal_tversky_ce
osteophyte_class_ids: [6, 7, 8, 9]
focal_tversky_fp_weight: 0.30
focal_tversky_fn_weight: 0.70
focal_tversky_gamma: 1.30
focal_tversky_smooth: 1.0e-6
lambda_ft: 1.0

resume: false
pretrained_path: ""
name: knee_1024x640_rwkv6a_focal
project: ""
exist_ok: true
pixel_spacing_mm: 0.10
auto_export_onnx: true
onnx_export_interval: 10
zero_shot_base_dir: ""
zero_shot_dataset_name: ""
do_deeps: false
model_id: 126
just_for_test: false
just_for_zero_shot: false
