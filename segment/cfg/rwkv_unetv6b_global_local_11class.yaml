# Shared-weight global/local RWKV-UNet V6b, preserving all 11 MESKO classes.
# Spatial values are always [height, width]. CLI values override these keys.
model: RWKV_UNetV6b
dataset: mesko
dataset_name: mesko
train_file_dir: train.txt
val_file_dir: val.txt
base_lr: 0.001
batch: 1
workers: 4
gpu: [0]
epochs: 200
seed: 2006

# Standardised source canvas and the two shared-core views.
imgsz: [1024, 640]
source_size: [1024, 640]
global_size: [720, 448]
local_size: 640
local_crop_jitter_y: 32

# Explicit background + 10 foreground classes. Do not remap to the 5-class specialist target.
num_classes: 11
osteophyte_only: false
input_channel: 3
aug_strategy: auto

# CE over all 11 classes + Focal Tversky over source class IDs 6, 7, 8, 9 only.
loss: osteophyte_focal_tversky_ce
osteophyte_class_ids: [6, 7, 8, 9]
focal_tversky_fp_weight: 0.30
focal_tversky_fn_weight: 0.70
focal_tversky_gamma: 1.30
focal_tversky_smooth: 1.0e-6
lambda_ft: 1.0
lambda_global: 1.0
lambda_local: 1.0

resume: false
pretrained_path: ""
name: rwkv_unetv6b_global_local_11class
project: ""
exist_ok: true
pixel_spacing_mm: 0.10
auto_export_onnx: true
onnx_export_interval: 10
zero_shot_base_dir: ""
zero_shot_dataset_name: ""
do_deeps: false
model_id: 127
just_for_test: false
just_for_zero_shot: false
